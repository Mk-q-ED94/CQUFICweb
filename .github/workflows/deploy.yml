name: Deploy Worker

on:
  push:
    branches: [main]

jobs:
  deploy-worker:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test — GET /api/posts
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://api.cqufic.cn/api/posts)
          echo "HTTP $status"
          [ "$status" = "200" ] || { echo "Smoke test failed"; exit 1; }
