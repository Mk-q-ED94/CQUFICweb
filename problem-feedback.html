center;justify-content:center;overflow:hidden;transition:all var(--transition-normal) ease;cursor:pointer}.school-logo{width:100%;height:100%;object-fit:cover;border-radius:50%}.nav-links{display:flex;list-style:none;gap:var(--spacing-sm);position:relative}.nav-link{text-decoration:none;color:var(--text-secondary);font-weight:var(--font-weight-medium);font-size:.9rem;transition:all .4s cubic-bezier(.175,.885,.32,1.275);position:relative;padding:var(--spacing-sm) var(--spacing-md);background:rgba(255,255,255,.6);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.4);border-radius:var(--border-radius-lg);box-shadow:0 4px 12px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.15);cursor:pointer;overflow:hidden;transform:translateZ(0);display:block}.nav-link:hover{color:var(--cqu-blue);transform:translateY(-2px) scale(1.05);background:rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2)}.nav-link:active{transform:translateY(0) scale(.98);transition:all .1s ease}.nav-link::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:var(--border-radius-lg);background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.05) 30%,rgba(255,255,255,.1) 70%,rgba(255,255,255,.05) 100%);opacity:0;transition:opacity .3s ease;pointer-events:none}.nav-link:hover::before{opacity:1}.nav-link::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .6s ease}.nav-link:hover::after{left:100%}.dropdown{position:relative}.dropdown:hover .nav-link{color:var(--cqu-blue);transform:translateY(-2px) scale(1.05);background:rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2)}.dropdown-content{position:absolute;top:100%;left:0;width:135px;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-lg);padding:var(--spacing-sm) 0;opacity:0;visibility:hidden;transform:translateY(-10px);transition:all .5s cubic-bezier(.175,.885,.32,1.275);z-index:1001;border:1px solid rgba(255,255,255,.4);margin-top:8px}.dropdown:hover .dropdown-content{opacity:1;visibility:visible;transform:translateY(0)}.dropdown-item{display:block;padding:var(--spacing-sm) var(--spacing-md);text-decoration:none;color:var(--text-secondary);transition:all var(--transition-fast) ease}.dropdown-item:hover{background:rgba(255,255,255,.5);color:var(--cqu-blue);transform:translateX(5px)}.feedback-hero{min-height:60vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#f5f7fa 0%,#e3e7ed 100%)}.feedback-content{text-align:center;z-index:10;max-width:800px;padding:var(--spacing-xxl) var(--spacing-md)}.feedback-title{font-size:clamp(2.5rem,5vw,4rem);font-weight:var(--font-weight-bold);margin-bottom:var(--spacing-md);line-height:1.1;opacity:0;transform:translateY(30px);animation:fadeInUp 1s var(--transition-slow) forwards}.feedback-subtitle{font-size:clamp(1.1rem,2vw,1.3rem);font-weight:var(--font-weight-normal);color:var(--text-secondary);margin-bottom:var(--spacing-xl);opacity:0;transform:translateY(30px);animation:fadeInUp 1s var(--transition-slower) forwards}.feedback-section{padding:var(--spacing-xxl) 0;min-height:var(--section-min-height);display:flex;align-items:center}.feedback-form-container{max-width:1000px;margin:0 auto;width:100%}.feedback-form{background:rgba(255,255,255,.9);border-radius:var(--border-radius-xl);padding:var(--spacing-xxl);box-shadow:var(--shadow-lg);transition:all var(--transition-normal) ease;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);position:relative;overflow:hidden}.feedback-form::before{content:'';position:absolute;top:0;left:0;width:100%;height:6px;background:linear-gradient(90deg,var(--cqu-blue),var(--cqu-orange))}.form-group{margin-bottom:var(--spacing-xl)}.form-label{display:block;margin-bottom:var(--spacing-sm);font-weight:var(--font-weight-semibold);color:var(--text-primary);font-size:1.1rem}.form-input,.form-select,.form-textarea{width:100%;padding:var(--spacing-md);border-radius:var(--border-radius-lg);border:1px solid var(--border-color);background:rgba(255,255,255,.9);font-family:var(--font-family);transition:all var(--transition-normal) ease;font-size:1.1rem;box-shadow:var(--shadow-sm)}.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--cqu-blue);box-shadow:0 0 0 3px rgba(30,79,161,.2);background:rgba(255,255,255,1);transform:translateY(-2px)}.form-textarea{min-height:200px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-lg)}.submit-btn{display:inline-block;padding:var(--spacing-md) var(--spacing-xl);background:linear-gradient(135deg,var(--cqu-blue) 0%,var(--cqu-light-blue) 100%);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.4);border-radius:var(--border-radius-lg);box-shadow:0 4px 12px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.15);color:white;text-decoration:none;font-weight:var(--font-weight-semibold);font-size:1.2rem;transition:all .4s cubic-bezier(.175,.885,.32,1.275);position:relative;overflow:hidden;transform:translateZ(0);cursor:pointer;border:none;width:100%;margin-top:var(--spacing-md)}.submit-btn:hover{background:linear-gradient(135deg,var(--cqu-dark-blue) 0%,var(--cqu-blue) 100%);transform:translateY(-4px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.2)}.submit-btn:active{transform:translateY(0) scale(.98);transition:all .1s ease}.submit-btn::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;border-radius:var(--border-radius-lg);background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,.05) 30%,rgba(255,255,255,.1) 70%,rgba(255,255,255,.05) 100%);opacity:0;transition:opacity .3s ease;pointer-events:none}.submit-btn:hover::before{opacity:1}.submit-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .6s ease}.submit-btn:hover::after{left:100%}@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@media (max-width:768px){.feedback-hero{min-height:auto;padding:calc(var(--spacing-md) + 60px) var(--spacing-sm) var(--spacing-md)}.feedback-content{padding:0}.feedback-title{font-size:1.8rem;margin-bottom:8px}.feedback-subtitle{font-size:.95rem;margin-bottom:var(--spacing-md);line-height:1.5}.feedback-section{padding:var(--spacing-md) 0;min-height:auto}.feedback-form{padding:var(--spacing-md);border-radius:14px}.feedback-form::before{height:4px}.form-group{margin-bottom:var(--spacing-md)}.form-label{font-size:.95rem;margin-bottom:6px}.form-input,.form-select,.form-textarea{padding:10px 12px;font-size:.95rem;border-radius:10px}.form-textarea{min-height:120px}.submit-btn{font-size:1rem;padding:12px var(--spacing-md);margin-top:6px}.form-row{grid-template-columns:1fr;gap:10px}}

<body>
    <!-- Header 由 shared.js 自动注入 -->

<section class="feedback-hero" id="home">
<div class="feedback-content">
<h1 class="feedback-title">问题反馈</h1>
<p class="feedback-subtitle">请详细描述您遇到的问题，我们将尽快为您解决</p>
</div>
</section>

<section class="feedback-section" id="feedback">
<div class="container">
<div class="feedback-form-container">
<form class="feedback-form" id="feedbackForm">
<div class="form-row">
<div class="form-group">
<label for="name" class="form-label">姓名</label>
<input type="text" id="name" class="form-input" placeholder="请输入您的姓名" maxlength="20" required>
</div>
<div class="form-group">
<label for="studentId" class="form-label">学号 <span style="font-weight:var(--font-weight-normal);color:var(--text-secondary);font-size:.9rem">（选填，没有可不填）</span></label>
<input type="text" id="studentId" class="form-input" placeholder="如已有学号请填写" maxlength="20">
</div>
</div>
<div class="form-row">
<div class="form-group">
<label for="contact" class="form-label">联系方式</label>
<input type="text" id="contact" class="form-input" placeholder="请输入您的手机号或邮箱" maxlength="50" required>
</div>
<div class="form-group">
<label for="problemType" class="form-label">问题类型</label>
<select id="problemType" class="form-select" required>
<option value="" disabled selected>请选择问题类型</option>
<option value="technical">技术问题</option>
<option value="content">内容错误</option>
<option value="suggestion">功能建议</option>
<option value="other">其他问题</option>
</select>
</div>
</div>
<div class="form-group">
<label for="problemDescription" class="form-label">问题描述</label>
<textarea id="problemDescription" class="form-textarea" placeholder="请详细描述您遇到的问题..." maxlength="1000" required></textarea>
</div>
<button type="submit" class="submit-btn" id="submitBtn">提交反馈</button>
</form>
</div>
</div>
</section>

    <script src="shared.js"></script>
<script>
const feedbackForm=document.getElementById('feedbackForm');
const isValidContact=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||/^1[3-9]\d{9}$/.test(v);
feedbackForm.addEventListener('submit',async function(e){
    e.preventDefault();
    const btn=document.getElementById('submitBtn');
    const contact=document.getElementById('contact').value.trim();
    if(!isValidContact(contact)){alert('请填写有效的手机号或邮箱');return;}
    btn.disabled=true;btn.textContent='提交中…';
    try{
        const res=await fetch('/api/submit-feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value.trim(),student_id:document.getElementById('studentId').value.trim(),contact:contact,type:document.getElementById('problemType').value,description:document.getElementById('problemDescription').value.trim()})});
        const data=await res.json();
        if(res.ok&&data.success){
            btn.textContent='✅ 已提交，感谢反馈！';
            feedbackForm.reset();
            setTimeout(()=>{btn.disabled=false;btn.textContent='提交反馈';},3000);
        }else{btn.disabled=false;btn.textContent='提交反馈';alert(data.error||'提交失败，请稍后重试');}
    }catch{btn.disabled=false;btn.textContent='提交反馈';alert('网络错误，请检查连接后重试');}
});
window.dispatchEvent(new Event('scroll'));
</script>
</body>
</html>
