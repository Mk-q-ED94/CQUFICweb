<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="重庆大学新生信息汇总库详情页，提供可执行步骤、完成清单、避坑提醒和相关资源。">
    <meta name="theme-color" content="#1e4fa1">
    <meta property="og:title" content="资源详情 - 重庆大学新生服务融合中心平台">
    <meta property="og:description" content="重庆大学新生信息汇总库详情页，提供可执行步骤、完成清单、避坑提醒和相关资源。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="重庆大学新生服务融合中心平台">
    <meta property="og:image" content="assets/icons/icon-512.png">
    <meta name="apple-mobile-web-app-title" content="CQUFIC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>资源详情 - 重庆大学新生服务融合中心平台</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="mobile.css">
    <style>
        body {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(239,243,250,0.96) 46%, rgba(245,245,247,1) 100%),
                linear-gradient(135deg, rgba(30,79,161,0.08), rgba(198,40,40,0.04));
        }

        .detail-page {
            display: block;
            min-height: auto;
            padding: calc(var(--header-height) + 72px) 0 var(--spacing-xxl);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-tertiary);
            font-size: 0.92rem;
            margin-bottom: var(--spacing-md);
        }

        .breadcrumb a {
            color: var(--cqu-blue);
            text-decoration: none;
        }

        .detail-hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: var(--spacing-xl);
            align-items: stretch;
            margin-bottom: var(--spacing-xl);
        }

        .hero-copy,
        .hero-side,
        .content-card,
        .side-card {
            background: rgba(255,255,255,0.76);
            border: 1px solid rgba(255,255,255,0.74);
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(18px);
        }

        .hero-copy {
            padding: var(--spacing-xl);
        }

        .topic-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(30,79,161,0.08);
            color: var(--cqu-blue);
            font-size: 0.88rem;
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-md);
        }

        .topic-title {
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.06;
            margin-bottom: var(--spacing-md);
            color: var(--text-primary);
        }

        .topic-summary {
            max-width: 760px;
            color: var(--text-secondary);
            font-size: 1.08rem;
            line-height: 1.75;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }

        .secondary-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            padding: 0 var(--spacing-md);
            border-radius: var(--border-radius-lg);
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(30,79,161,0.14);
            color: var(--cqu-blue);
            text-decoration: none;
            font-weight: var(--font-weight-medium);
            transition: all var(--transition-fast) ease;
        }

        .secondary-cta:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.95);
            box-shadow: var(--shadow-sm);
        }

        .hero-side {
            padding: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: var(--spacing-md);
        }

        .side-icon {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--cqu-blue), var(--cqu-orange));
            color: #fff;
            font-size: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .info-list {
            display: grid;
            gap: var(--spacing-sm);
        }

        .progress-panel {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid rgba(30,79,161,0.08);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            gap: var(--spacing-sm);
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .progress-track {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(30,79,161,0.1);
        }

        .progress-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--cqu-blue), var(--cqu-orange));
            transition: width var(--transition-normal) ease;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) 0;
            border-bottom: 1px solid rgba(30,79,161,0.08);
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .info-row strong {
            color: var(--text-primary);
            font-weight: var(--font-weight-semibold);
            text-align: right;
        }

        #steps,
        #checklist,
        #related {
            scroll-margin-top: calc(var(--header-height) + 96px);
        }

        .mobile-jumpbar {
            display: none;
        }

        .mobile-jumpbar a:focus-visible,
        .tool-btn:focus-visible,
        .secondary-cta:focus-visible {
            outline: 2px solid rgba(30,79,161,0.3);
            outline-offset: 3px;
        }

        .detail-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: var(--spacing-lg);
            align-items: start;
        }

        .main-stack,
        .side-stack {
            display: grid;
            gap: var(--spacing-lg);
        }

        .content-card,
        .side-card {
            padding: var(--spacing-lg);
        }

        .content-card h2,
        .side-card h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.35rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
        }

        .content-card h2 i,
        .side-card h2 i {
            color: var(--cqu-blue);
        }

        .essentials-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--spacing-sm);
        }

        .essential {
            padding: var(--spacing-md);
            border-radius: var(--border-radius-lg);
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(30,79,161,0.09);
        }

        .essential span {
            display: block;
            color: var(--text-tertiary);
            font-size: 0.82rem;
            margin-bottom: 6px;
        }

        .essential strong {
            color: var(--cqu-blue);
            line-height: 1.35;
        }

        .steps {
            list-style: none;
            counter-reset: step;
            display: grid;
            gap: var(--spacing-md);
        }

        .steps li {
            counter-increment: step;
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: var(--spacing-md);
            align-items: start;
        }

        .steps li::before {
            content: counter(step);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--cqu-blue);
            color: #fff;
            font-weight: var(--font-weight-bold);
            box-shadow: var(--shadow-sm);
        }

        .step-body h3 {
            color: var(--text-primary);
            font-size: 1.08rem;
            margin-bottom: 6px;
        }

        .step-body p,
        .notice-box p {
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .step-disclosure,
        .faq-item {
            overflow: hidden;
        }

        .step-disclosure summary,
        .faq-item summary {
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            list-style: none;
            touch-action: manipulation;
        }

        .step-disclosure summary::-webkit-details-marker,
        .faq-item summary::-webkit-details-marker {
            display: none;
        }

        .step-disclosure summary h3,
        .faq-item summary h3 {
            margin-bottom: 0;
        }

        .step-disclosure summary::after,
        .faq-item summary::after {
            content: '+';
            width: 28px;
            height: 28px;
            flex: 0 0 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(30,79,161,0.08);
            color: var(--cqu-blue);
            font-weight: var(--font-weight-bold);
        }

        .step-disclosure[open] summary::after,
        .faq-item[open] summary::after {
            content: '-';
        }

        .checklist {
            display: grid;
            gap: 10px;
        }

        .check-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            color: var(--text-secondary);
            line-height: 1.55;
            cursor: pointer;
            user-select: none;
        }

        .check-item input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .check-box {
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            border-radius: 7px;
            border: 1px solid rgba(30,79,161,0.28);
            background: rgba(255,255,255,0.82);
            color: transparent;
            transition: all var(--transition-fast) ease;
        }

        .check-item input:checked + .check-box {
            border-color: var(--cqu-blue);
            background: var(--cqu-blue);
            color: #fff;
            box-shadow: 0 6px 16px rgba(30,79,161,0.18);
        }

        .check-item input:focus-visible + .check-box {
            outline: 2px solid rgba(30,79,161,0.28);
            outline-offset: 3px;
        }

        .check-item input:checked ~ span {
            color: var(--text-tertiary);
            text-decoration: line-through;
        }

        .faq-item {
            padding: var(--spacing-md) 0;
            border-bottom: 1px solid rgba(30,79,161,0.08);
        }

        .faq-item:last-child { border-bottom: 0; }

        .faq-item h3 {
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 0;
        }

        .faq-item p,
        .related-card p {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.94rem;
        }

        .faq-item p {
            margin-top: 6px;
        }

        .notice-box {
            padding: var(--spacing-md);
            border-radius: var(--border-radius-lg);
            background: rgba(245,124,0,0.09);
            border: 1px solid rgba(245,124,0,0.18);
        }

        .notice-box strong {
            display: block;
            color: var(--cqu-orange);
            margin-bottom: 6px;
        }

        .related-list {
            display: grid;
            gap: var(--spacing-sm);
        }

        .related-card {
            display: block;
            padding: var(--spacing-md);
            border-radius: var(--border-radius-lg);
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(30,79,161,0.09);
            color: inherit;
            text-decoration: none;
            transition: all var(--transition-fast) ease;
        }

        .related-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .related-card h3 {
            color: var(--cqu-blue);
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .tool-actions {
            display: grid;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .tool-btn {
            min-height: 44px;
            border: 1px solid rgba(30,79,161,0.14);
            border-radius: var(--border-radius-lg);
            background: rgba(255,255,255,0.78);
            color: var(--cqu-blue);
            cursor: pointer;
            font-family: var(--font-family);
            font-weight: var(--font-weight-medium);
            transition: all var(--transition-fast) ease;
        }

        .tool-btn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.95);
            box-shadow: var(--shadow-sm);
        }

        .copy-status {
            min-height: 20px;
            color: var(--text-tertiary);
            font-size: 0.86rem;
            overflow-wrap: anywhere;
        }

        .fallback {
            text-align: center;
            padding: var(--spacing-xxl);
        }

        @media (max-width: 1024px) {
            .detail-hero,
            .detail-layout { grid-template-columns: 1fr; }
            .hero-side { min-height: 260px; }
        }

        @media (max-width: 720px) {
            .detail-page {
                padding-top: calc(var(--header-height) + 42px);
                padding-bottom: calc(var(--spacing-xl) + env(safe-area-inset-bottom));
            }

            .breadcrumb {
                gap: 8px;
                margin-bottom: 12px;
                overflow-x: auto;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .breadcrumb::-webkit-scrollbar { display: none; }

            .detail-hero {
                gap: 12px;
                margin-bottom: 12px;
            }

            .hero-copy,
            .content-card,
            .side-card,
            .hero-side {
                padding: 16px;
                border-radius: 20px;
            }

            .topic-kicker {
                min-height: 30px;
                margin-bottom: 12px;
                font-size: 0.82rem;
            }

            .topic-title {
                font-size: 2rem;
                line-height: 1.08;
                margin-bottom: 12px;
            }

            .topic-summary {
                font-size: 0.95rem;
                line-height: 1.65;
            }

            .hero-actions {
                flex-direction: column;
                gap: 10px;
                margin-top: 16px;
            }

            .hero-cta,
            .secondary-cta { width: 100%; justify-content: center; }

            .hero-side {
                min-height: 0;
                gap: 12px;
            }

            .side-icon {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
                border-radius: 16px;
            }

            .info-list { gap: 0; }

            .info-row {
                padding: 10px 0;
                font-size: 0.86rem;
            }

            .info-row strong {
                max-width: 58%;
                overflow-wrap: anywhere;
            }

            .progress-panel {
                margin-top: 4px;
                padding-top: 12px;
            }

            .mobile-jumpbar {
                position: sticky;
                top: calc(var(--header-height) + 18px);
                z-index: 25;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
                margin: 0 0 var(--spacing-md);
                padding: 8px;
                border-radius: 18px;
                background: rgba(255,255,255,0.82);
                border: 1px solid rgba(255,255,255,0.78);
                box-shadow: var(--shadow-sm);
                backdrop-filter: blur(18px);
            }

            .mobile-jumpbar a {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                border-radius: 14px;
                background: rgba(30,79,161,0.08);
                color: var(--cqu-blue);
                text-decoration: none;
                font-size: 0.9rem;
                font-weight: var(--font-weight-semibold);
                touch-action: manipulation;
            }

            .detail-layout {
                display: grid;
                grid-template-columns: 1fr;
                gap: var(--spacing-md);
            }

            .main-stack,
            .side-stack { display: contents; }

            .essentials-card { order: 1; }
            .checklist-card { order: 2; }
            .steps-card { order: 3; }
            .faq-card { order: 4; }
            .notice-card { order: 5; }
            .related-card-panel { order: 6; }

            .content-card h2,
            .side-card h2 {
                font-size: 1.12rem;
                margin-bottom: 14px;
            }

            .essentials-grid { grid-template-columns: 1fr; }

            .essential {
                padding: 14px;
                border-radius: 16px;
            }

            .steps li { grid-template-columns: 36px minmax(0, 1fr); gap: var(--spacing-sm); }
            .steps li::before { width: 36px; height: 36px; }

            .step-body h3 { font-size: 1rem; }

            .step-body p,
            .notice-box p {
                font-size: 0.92rem;
                line-height: 1.65;
            }

            .step-disclosure p,
            .faq-item p {
                display: -webkit-box;
                -webkit-line-clamp: 4;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .step-disclosure[open] p,
            .faq-item[open] p {
                display: block;
                overflow: visible;
            }

            .checklist { gap: 8px; }

            .check-item {
                min-height: 44px;
                align-items: center;
                gap: 12px;
            }

            .check-box {
                width: 28px;
                height: 28px;
                flex-basis: 28px;
                margin-top: 0;
                border-radius: 9px;
            }

            .tool-btn {
                min-height: 48px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 380px) {
            .topic-title { font-size: 1.82rem; }
            .mobile-jumpbar a { font-size: 0.84rem; }
            .info-row { align-items: flex-start; flex-direction: column; gap: 4px; }
            .info-row strong { max-width: 100%; text-align: left; }
        }

        @media (hover: none) and (pointer: coarse) {
            .secondary-cta:hover,
            .related-card:hover,
            .tool-btn:hover {
                transform: none;
                box-shadow: none;
            }

            .mobile-jumpbar a:active,
            .secondary-cta:active,
            .tool-btn:active,
            .related-card:active {
                transform: scale(0.98);
            }
        }
    </style>
</head>
<body>
    <!-- Header 由 shared.js 自动注入 -->

    <section class="detail-page">
        <div class="container" id="app"></div>
    </section>

    <script src="shared.js"></script>
    <script>

                related: ['academic-planning', 'calendar', 'account-management']

            'academic-planning': {
                title: '学业规划',

                icon: 'fas fa-graduation-cap',

        function esc(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function topicUrl(id) {
            const topic = TOPICS[id];
            return topic && topic.external ? topic.external : `info-detail.html?topic=${encodeURIComponent(id)}`;
        }

        function getTopicId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('topic') || 'course-selection';

                        </div>
                    </div>`;
                document.title = '资源未找到 - 重庆大学新生服务融合中心平台';
                return;
            }

            if (topic.external && !topic.steps) {
                window.location.href = topic.external;
                return;
            }

            document.title = `${topic.title} - 信息汇总库`;
            app.innerHTML = `
                <nav class="breadcrumb" aria-label="面包屑">
                    <a href="info-library.html">信息汇总库</a>
                    <i class="fas fa-chevron-right"></i>
                    <span>${esc(topic.title)}</span>
                </nav>

                <div class="detail-hero">
                    <div class="hero-copy">
                        <div class="topic-kicker"><i class="${topic.icon}"></i>${esc(topic.category)}</div>
                        <h1 class="topic-title">${esc(topic.title)}</h1>
                        <p class="topic-summary">${esc(topic.summary)}</p>
                        <div class="hero-actions">
                            <a class="hero-cta" href="#steps">查看办理步骤</a>
                            <a class="secondary-cta" href="info-library.html"><i class="fas fa-arrow-left"></i> 返回资源库</a>
                        </div>
                    </div>
                    <aside class="hero-side" aria-label="资源概要">
                        <div class="side-icon"><i class="${topic.icon}"></i></div>
                        <div class="info-list">
                            <div class="info-row"><span>适用时间</span><strong>${esc(topic.time)}</strong></div>
                            <div class="info-row"><span>主要对象</span><strong>${esc(topic.owner)}</strong></div>
                            <div class="info-row"><span>更新提示</span><strong>${esc(topic.updated)}</strong></div>
                        </div>
                        <div class="progress-panel">
                            <div class="progress-label">
                                <span>清单完成度</span>
                                <strong id="progressText">0%</strong>
                            </div>
                            <div class="progress-track" aria-hidden="true">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                        </div>
                    </aside>
                </div>

                <nav class="mobile-jumpbar" aria-label="本页快捷导航">
                    <a href="#steps"><i class="fas fa-route"></i>步骤</a>
                    <a href="#checklist"><i class="fas fa-list-check"></i>清单</a>
                    <a href="#related"><i class="fas fa-link"></i>相关</a>
                </nav>

                <div class="detail-layout">
                    <main class="main-stack">
                        <article class="content-card essentials-card">
                            <h2><i class="fas fa-thumbtack"></i> 先抓三件事</h2>
                            <div class="essentials-grid">
                                ${topic.essentials.map(item => `
                                    <div class="essential">
                                        <span>${esc(item[0])}</span>
                                        <strong>${esc(item[1])}</strong>
                                    </div>`).join('')}
                            </div>
                        </article>

                        <article class="content-card steps-card" id="steps">
                            <h2><i class="fas fa-route"></i> 行动步骤</h2>
                            <ol class="steps">
                                ${topic.steps.map((step, index) => `
                                    <li>
                                        <details class="step-body step-disclosure" data-mobile-collapse data-collapse-group="steps" ${index === 0 ? 'open' : ''}>
                                            <summary><h3>${esc(step[0])}</h3></summary>
                                            <p>${esc(step[1])}</p>
                                        </details>
                                    </li>`).join('')}
                            </ol>
                        </article>

                        <article class="content-card faq-card">
                            <h2><i class="fas fa-circle-question"></i> 常见问题</h2>
                            ${topic.faq.map((item, index) => `
                                <details class="faq-item" data-mobile-collapse data-collapse-group="faq" ${index === 0 ? 'open' : ''}>
                                    <summary><h3>${esc(item[0])}</h3></summary>
                                    <p>${esc(item[1])}</p>
                                </details>`).join('')}
                        </article>
                    </main>

                    <aside class="side-stack">
                        <div class="side-card checklist-card" id="checklist">
                            <h2><i class="fas fa-list-check"></i> 完成清单</h2>
                            <div class="checklist">
                                ${topic.checklist.map((item, index) => `
                                    <label class="check-item">
                                        <input type="checkbox" data-check-index="${index}">
                                        <span class="check-box"><i class="fas fa-check"></i></span>
                                        <span>${esc(item)}</span>
                                    </label>`).join('')}
                            </div>
                            <div class="tool-actions">
                                <button class="tool-btn" type="button" id="copyChecklistBtn">
                                    <i class="fas fa-copy"></i> 复制清单
                                </button>
                                <button class="tool-btn" type="button" id="resetChecklistBtn">
                                    <i class="fas fa-rotate-left"></i> 重置进度
                                </button>
                                <div class="copy-status" id="copyStatus" aria-live="polite"></div>
                            </div>
                        </div>

                        <div class="side-card notice-card">
                            <h2><i class="fas fa-triangle-exclamation"></i> 避坑提醒</h2>
                            <div class="notice-box">
                                <strong>先核验，再行动</strong>
                                <p>${esc(topic.notice)}</p>
                            </div>
                        </div>

                        <div class="side-card related-card-panel" id="related">
                            <h2><i class="fas fa-link"></i> 相关资源</h2>
                            <div class="related-list">
                                ${topic.related.map(id => {
                                    const related = TOPICS[id];
                                    if (!related) return '';
                                    return `
                                        <a class="related-card" href="${topicUrl(id)}">
                                            <h3>${esc(related.title)}</h3>
                                            <p>${esc(related.category)} · 继续查看</p>
                                        </a>`;
                                }).join('')}
                            </div>
                        </div>
                    </aside>
                </div>
            `;

            initChecklistTools(topicId, topic);
            initMobileCollapse();
        }

        function initMobileCollapse() {
            const details = Array.from(document.querySelectorAll('[data-mobile-collapse]'));
            const mq = window.matchMedia('(max-width: 720px)');

            function sync() {
                const seen = new Set();
                details.forEach(item => {
                    const group = item.dataset.collapseGroup || 'default';
                    if (!mq.matches) {
                        item.open = true;
                        return;
                    }
                    item.open = !seen.has(group);
                    seen.add(group);
                });
            }

            sync();
            if (mq.addEventListener) {
                mq.addEventListener('change', sync);
            } else {
                mq.addListener(sync);
            }
        }

        function initChecklistTools(topicId, topic) {
            const storageKey = `cqufic-info-progress:${topicId}`;
            const checks = Array.from(document.querySelectorAll('[data-check-index]'));
            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');
            const copyStatus = document.getElementById('copyStatus');

            function readSaved() {
                try {
                    return JSON.parse(localStorage.getItem(storageKey) || '[]');
                } catch {
                    return [];
                }
            }

            function writeSaved(values) {
                localStorage.setItem(storageKey, JSON.stringify(values));
            }

            function updateProgress() {
                const completed = checks.filter(item => item.checked).length;
                const percent = checks.length ? Math.round((completed / checks.length) * 100) : 0;
                progressText.textContent = `${percent}%`;
                progressFill.style.width = `${percent}%`;
                writeSaved(checks.map(item => item.checked));
            }

            readSaved().forEach((checked, index) => {
                if (checks[index]) checks[index].checked = Boolean(checked);
            });

            checks.forEach(item => item.addEventListener('change', updateProgress));
            updateProgress();

            document.getElementById('resetChecklistBtn').addEventListener('click', () => {
                checks.forEach(item => { item.checked = false; });
                updateProgress();
                copyStatus.textContent = '进度已重置。';
            });

            document.getElementById('copyChecklistBtn').addEventListener('click', async () => {
                const text = [
                    `${topic.title} 完成清单`,
                    ...topic.checklist.map((item, index) => `${checks[index].checked ? '☑' : '☐'} ${item}`)
                ].join('\n');

                try {
                    await navigator.clipboard.writeText(text);
                    copyStatus.textContent = '清单已复制到剪贴板。';
                } catch {
                    copyStatus.textContent = text;
                }
            });
        }

        renderTopic(getTopicId());
    </script>
</body>
</html>
