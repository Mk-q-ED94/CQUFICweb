# Cloudflare Worker — CQU FIC API
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/
#
# 部署前须用 wrangler secret put 设置以下 Secret：
#   SUPABASE_URL              — Supabase 项目 URL
#   SUPABASE_SERVICE_ROLE_KEY — Supabase service_role 密钥（仅后端使用）
#   ADMIN_PASSWORD            — 管理员登录密码
#   ADMIN_SECRET              — HMAC 签名密钥（任意随机字符串）
#   ALLOWED_ORIGIN            — https://cqufic.cn
#   MAPBOX_TOKEN              — Mapbox public access token (pk.eyJ1Ij...)

name = "cqufic-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# 静态文件目录（根目录直接提供，无需 build 步骤）
[assets]
directory = "."
binding = "ASSETS"

# cqufic.cn 全部由此 Worker 接管（静态文件 + /api/*）
[[routes]]
pattern = "cqufic.cn"
custom_domain = true
