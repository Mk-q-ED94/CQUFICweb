# Cloudflare Worker — CQU FIC API
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/
#
# 首次部署步骤：
#   1. wrangler d1 create cqufic-db          （创建 D1 数据库，将 database_id 填入下方）
#   2. wrangler d1 execute cqufic-db --file=setup-d1.sql  （初始化表结构）
#   3. wrangler secret put ADMIN_PASSWORD
#   4. wrangler secret put ADMIN_SECRET
#   5. wrangler secret put ALLOWED_ORIGIN    （值：https://cqufic.cn）
#   6. wrangler secret put MAPBOX_TOKEN      （值：pk.eyJ1Ij...）
#   7. wrangler deploy

name = "cqufic-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# 静态文件目录（根目录直接提供，无需 build 步骤）
[assets]
directory = "."
binding = "ASSETS"

# cqufic.cn 全部由此 Worker 接管（静态文件 + /api/*）
[[routes]]
pattern = "cqufic.cn"
custom_domain = true

# D1 数据库绑定通过 Cloudflare 控制台配置：
# Workers & Pages → cqufic-api → Settings → Bindings → D1 Database
# binding name = "DB"，选择 "cqufic-db"
