# Cloudflare Worker — CQU FIC API
# 文档：https://developers.cloudflare.com/workers/wrangler/configuration/
#
# 部署前须在 Cloudflare 后台或用 wrangler secret put 设置以下 Secret：
#   SUPABASE_URL              — Supabase 项目 URL
#   SUPABASE_SERVICE_ROLE_KEY — Supabase service_role 密钥（仅后端使用）
#   ADMIN_PASSWORD            — 管理员登录密码
#   ADMIN_SECRET              — HMAC 签名密钥（任意随机字符串）
#   ALLOWED_ORIGIN            — 允许跨域的前端域名（如 https://cquficweb.pages.dev）

name = "cqufic-api"
main = "worker.js"
compatibility_date = "2025-01-01"
