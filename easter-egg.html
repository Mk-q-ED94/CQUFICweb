<head>

    <meta property="og:description" content="重庆大学新生服务融合中心平台，为新生提供入学流程、校园信息、地图导航和反馈交流服务。">

    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <style>
        /* ===== CSS变量系统 ===== */
        :root {
            /* 重庆大学主题色 - 蓝色为主 */
            --cqu-blue: #1e4fa1;
            --cqu-dark-blue: #153a7a;
            --cqu-light-blue: #2a65c7;
            --cqu-orange: #f57c00;
            --cqu-red: #c62828;
            --secondary-color: #86868b;
            --accent-color: #1e88e5;
            --background-color: #f5f5f7;
            --surface-color: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #515154;
            --text-tertiary: #86868b;
            --border-color: #d2d2d7;
            
            /* 字体系统 */
            --font-family: 'Times New Roman', Times, serif;
            --font-weight-light: 300;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;
            
            /* 间距系统 */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
            --spacing-xxl: 64px;
            
            /* 边框半径 */
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 18px;
            --border-radius-xl: 24px;
            
            /* 阴影 */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.16);
            
            /* 动效时长 */
            --transition-fast: 0.2s;
            --transition-normal: 0.4s;
            --transition-slow: 0.6s;
            --transition-slower: 0.8s;
            
            /* 布局尺寸 */
            --header-height: 64px;
            --container-max-width: 1200px;
            --section-min-height: 80vh;
        }

        /* ===== 重置与基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family);
            font-weight: var(--font-weight-normal);
            background: radial-gradient(circle at 50% 18%, #2a65c7 0%, #1e4fa1 42%, #102f63 100%);
            color: #fff;
            line-height: 1.5;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== 布局容器 ===== */
        .container {
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 var(--spacing-md);
        }

        /* ===== 导航栏样式 ===== */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: var(--header-height);
            background:
                radial-gradient(125% 110% at 12% -25%, rgba(255,255,255,.55), rgba(255,255,255,0) 46%),
                linear-gradient(148deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.06) 34%, rgba(255,255,255,0) 60%),
                rgba(255,255,255,.12);
            backdrop-filter: blur(44px) saturate(290%) brightness(1.12);
            -webkit-backdrop-filter: blur(44px) saturate(290%) brightness(1.12);
            border-radius: var(--border-radius-xl);
            border: 0.5px solid rgba(255,255,255,.40);
            box-shadow:
                0 0 0 0.5px rgba(255,255,255,.25),
                0 8px 32px   rgba(0,0,0,.12),
                0 2px 6px    rgba(0,0,0,.06),
                inset 0  1.5px 0  rgba(255,255,255,.92),
                inset 0 -10px 22px rgba(255,255,255,.10),
                inset 0 -1px  0   rgba(0,0,0,.10);
            z-index: 1000;
            transition: all var(--transition-normal) ease;
            isolation: isolate;
        }

        header::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(105deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.42) 48%, rgba(255,255,255,0) 60%);
            background-size: 260% 100%;
            background-repeat: no-repeat;
            mix-blend-mode: screen;
            opacity: .7;
            animation: lg-sheen 8s ease-in-out infinite;
        }

        @keyframes lg-sheen {
            0%, 100% { background-position: 135% 0; }
            50%      { background-position: -35% 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            header::after { animation: none; opacity: .4; background-position: 60% 0; }
        }

        header .nav-container { position: relative; z-index: 1; }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 0 var(--spacing-md);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-decoration: none;
        }

        .logo-icon {
            font-family: var(--font-family);
            font-size: 1.8rem;
            font-weight: var(--font-weight-bold);
            letter-spacing: 4px;
            background: linear-gradient(135deg, #c62828 0%, #ff7043 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 
                0 1px 0 rgba(255,255,255,0.5),
                0 2px 4px rgba(0,0,0,0.2),
                0 4px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-main {
            font-size: 1.1rem;
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
        }

        .logo-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: var(--spacing-sm);
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: var(--font-weight-medium);
            font-size: 0.9rem;
            transition: all var(--transition-normal) ease;
            position: relative;
            padding: var(--spacing-sm) var(--spacing-md);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--border-radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .nav-link:hover {
            color: var(--cqu-blue);
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        /* ===== 彩蛋页面样式 ===== */
        .easter-egg-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .easter-egg-container {
            position: relative;
            z-index: 2;
            max-width: 560px;
            padding: 0 var(--spacing-md);
        }

        .easter-egg {
            width: 190px;
            height: 248px;
            background:
                radial-gradient(circle at 50% 30%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%),
                linear-gradient(150deg, #2a65c7 0%, #1e4fa1 45%, #c62828 130%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            margin: 0 auto 34px;
            box-shadow: 0 16px 40px rgba(0,0,0,.35), inset 0 2px 6px rgba(255,255,255,.25);
            position: relative;
            animation: bounce 2s infinite;
        }

        /* 蛋身上的金色校训环带 */
        .easter-egg::after {
            content: '耐劳苦 · 尚俭朴 · 勤学业 · 爱国家';
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 86%;
            text-align: center;
            font-size: .72rem;
            letter-spacing: 1px;
            color: #ffd76b;
            text-shadow: 0 1px 2px rgba(0,0,0,.4);
            white-space: nowrap;
        }

        /* 蛋中央的校徽 */
        .egg-badge {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 96px;
            height: 96px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
        }

        .easter-egg-title {
            font-size: 2.6rem;
            color: #fff;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 2px 12px rgba(0,0,0,.3);
        }

        .egg-couplet {
            font-size: 1.35rem;
            color: #ffd76b;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .easter-egg-description {
            font-size: 1.1rem;
            color: rgba(255,255,255,.85);
            margin-bottom: 18px;
            max-width: 460px;
            margin-left: auto;
            margin-right: auto;
        }

        .egg-since {
            font-size: .95rem;
            color: rgba(255,255,255,.7);
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* 大礼堂剪影 */
        .hall-silhouette {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(680px, 100%);
            height: auto;
            fill: rgba(255,255,255,.10);
            z-index: 1;
            pointer-events: none;
        }

        /* iOS26液态按钮效果 */
        .hero-cta {
            display: inline-block;
            padding: var(--spacing-sm) var(--spacing-lg);
            background: linear-gradient(135deg, var(--cqu-blue) 0%, var(--cqu-light-blue) 100%);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius-lg);
            font-weight: var(--font-weight-medium);
            font-size: 1.1rem;
            transition: all var(--transition-normal) ease;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 4px 14px 0 rgba(30, 79, 161, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .hero-cta:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 6px 20px 0 rgba(30, 79, 161, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @media (max-width: 768px) {
            .easter-egg { width: 150px; height: 196px; margin-bottom: 26px; }
            .egg-badge { width: 76px; height: 76px; }
            .easter-egg::after { font-size: .62rem; letter-spacing: 0; }
            .easter-egg-title { font-size: 1.9rem; }
            .egg-couplet { font-size: 1.1rem; letter-spacing: 2px; }
            .easter-egg-description { font-size: 1rem; }
            .hall-silhouette { width: 100%; opacity: .9; }
        }
    </style>

<body>
    <!-- 网站头部 -->
    <header id="header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="assets/logo-mark.png" alt="CQUFIC" style="height:44px;width:auto;display:block">
                <div class="logo-text">
                    <div class="logo-main">重庆大学新生服务融合中心平台</div>
                    <div class="logo-sub">Chong Qing University Freshman Integration Center</div>
                </div>
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">首页</a></li>
            </ul>
        </div>
    </header>

    <!-- 彩蛋页面内容 -->
    <section class="easter-egg-page">
        <div class="container">
            <div class="easter-egg-container">
                <div class="easter-egg">
                    <img src="CQUS.svg" class="egg-badge" alt="重庆大学校徽">
                </div>
                <h1 class="easter-egg-title">彩蛋一 · 重大印记</h1>
                <p class="egg-couplet">江汉思禹功 · 教化溯文翁</p>
                <p class="easter-egg-description">恭喜你发现了第一个彩蛋！这里藏着重庆大学的校训与精神——愿你在这里耐劳苦、尚俭朴、勤学业、爱国家。</p>
                <p class="egg-since">重庆大学 · 创建于 1929 年</p>
                <a href="index.html" class="hero-cta">返回首页</a>
            </div>
        </div>
    </section>

    <!-- 大礼堂剪影 -->
    <svg class="hall-silhouette" viewBox="0 0 240 124" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <rect x="34" y="96" width="172" height="28"/>
        <rect x="46" y="88" width="148" height="8"/>
        <rect x="90" y="62" width="60" height="26"/>
        <polygon points="82,62 158,62 148,52 92,52"/>
        <rect x="104" y="40" width="32" height="12"/>
        <polygon points="90,40 150,40 140,30 100,30"/>
        <polygon points="98,30 142,30 134,22 106,22"/>
        <polygon points="106,22 134,22 120,11"/>
        <rect x="118" y="3" width="4" height="9"/>
        <circle cx="120" cy="3" r="3"/>
    </svg>

    <script>
        // ===== 滚动效果 =====
        window.addEventListener('scroll', () => {
            // 导航栏滚动效果
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
    <script src="bg.js"></script>
</body>
